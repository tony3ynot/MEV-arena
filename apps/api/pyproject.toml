[project]
name = "mev-arena-api"
version = "0.0.0"
description = "MEV Arena API + WebSocket gateway (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "simulation-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
simulation-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mev_arena_api"]
