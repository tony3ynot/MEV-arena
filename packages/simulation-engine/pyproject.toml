[project]
name = "simulation-engine"
version = "0.0.0"
description = "MEV Arena core domain: AMM, mempool, block builder, deterministic execution. No I/O, no framework deps."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulation_engine"]
